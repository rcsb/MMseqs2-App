# Docker build and push workflow

name: Run CI/CD Docker Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - '**'

jobs:
  run-workflow:
    name: "Run automated docker workflow"
    uses: rcsb/devops-cicd-github-actions/.github/workflows/workflow-docker.yaml@master
    with:
      dockerfile_location: "Dockerfile.backend"  # The location of the Dockerfile relative to the root of the repository. Defaults to "Dockerfile".
      repo_project: "rcsb"  # REQUIRED. The name of the project or organization in the remote Docker image repository.
      docker_image_name: "rcsb-mmseqs-app"  # REQUIRED. The name of the Docker image to create.
      docker_build_context: "."  # The path location of the docker build context, relative to the project root. Defaults to the project root.
      # This fork's master is upstream's, which is ~900 commits past the v7 line we build
      # on, so an image built from it must not be the one tagged "production". Turn this
      # back on once a branch of ours is the mainline (and set mainline_branch to it).
      do_production_build: "false"
